<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EquVolve</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#111111">

  <!-- Apply a theme picked with the toggle before the first paint, so the
       page never flashes the other theme. "auto" follows the device. -->
  <script>
    try {
      var theme = localStorage.getItem('equvolve-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>

  <!-- Pinned versions: an unpinned major release could break the live demo.
       The integrity hashes (checked against the npm packages) make the
       browser refuse a file that differs from the published one. When
       you change a version, update its hash; see docs/DEVELOPMENT.md. -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"
          integrity="sha384-W/1Fp/LgAYO/oTn9Gs+PbeWuMuq1eQCnUMPCeg8POmMYchhzxctjEqtbiCIxDOON"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4.5.0/dist/vue-router.global.prod.js"
          integrity="sha384-fKhZ7XFlx1XxZ69zuElETNwLMIEVbnq6fLGrT0qMuLVEtFnTTQUeQZETOSFgDJa0"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.4/marked.min.js"
          integrity="sha384-2NndlFAl0twi2nmu3w9mixodZFiN2fbxlakcYJF86bn1JeS1VB87/XqA7cqymzS+"
          crossorigin="anonymous"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <nav>
    <router-link to="/">{{ $t('nav.home') }}</router-link>
    <router-link to="/about">{{ $t('nav.about') }}</router-link>
    <span class="nav-end">
      <select
        class="language-select small"
        :aria-label="$t('nav.language')"
        :value="language"
        @change="setLanguage($event.target.value)"
      >
        <option v-for="l in languages" :key="l.code" :value="l.code" :lang="l.code" translate="no">{{ l.name }}</option>
      </select>
      <button type="button" class="theme-toggle small" :title="themeTitle" :aria-label="themeTitle" @click="cycleTheme">{{ themeLabel }}</button>
    </span>
  </nav>

  <router-view></router-view>
</div>

<script src="i18n.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>

</body>
</html>
