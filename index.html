<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EquVolve</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#111111">

  <!-- Apply a theme picked with the toggle before the first paint, so the
       page never flashes the other theme. "auto" follows the device. -->
  <script>
    try {
      var theme = localStorage.getItem('equvolve-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>

  <!-- Pinned versions: an unpinned major release could break the live demo. -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4.5.0/dist/vue-router.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.4/marked.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <nav>
    <router-link to="/">{{ $t('nav.home') }}</router-link>
    <router-link to="/about">{{ $t('nav.about') }}</router-link>
    <button type="button" class="theme-toggle small" :title="themeTitle" :aria-label="themeTitle" @click="cycleTheme">{{ themeLabel }}</button>
  </nav>

  <router-view></router-view>
</div>

<script src="i18n.js"></script>
<script src="shared.js"></script>
<script src="app.js"></script>

</body>
</html>
